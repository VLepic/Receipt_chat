services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sp2}
      POSTGRES_USER: ${POSTGRES_USER:-sp2}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - ${SP2_DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sp2} -d ${POSTGRES_DB:-sp2}"]
      interval: 10s
      timeout: 5s
      retries: 5

  receiptchat:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-ReceiptChat}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env.production}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sp2}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}@postgres:5432/${POSTGRES_DB:-sp2}
      CORS_ORIGINS: ${CORS_ORIGINS:-[]}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      DOCUMENT_STORAGE_DIR: ${DOCUMENT_STORAGE_DIR:-/app/storage/documents}
      DOCUMENT_MAX_UPLOAD_BYTES: ${DOCUMENT_MAX_UPLOAD_BYTES:-10485760}
    stop_grace_period: 90s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT:-${FRONTEND_PORT:-5173}}:8080"
    volumes:
      - ${SP2_DATA_DIR:-./data}/documents:${DOCUMENT_STORAGE_DIR:-/app/storage/documents}
      - ${SP2_DATA_DIR:-./data}/easyocr:/root/.EasyOCR
    depends_on:
      postgres:
        condition: service_healthy
