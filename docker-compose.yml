services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: sp2
      POSTGRES_USER: sp2
      POSTGRES_PASSWORD: sp2
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sp2 -d sp2"]
      interval: 10s
      timeout: 5s
      retries: 5

  receiptchat:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-ReceiptChat}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      SECRET_KEY: ${SECRET_KEY:-change-me}
      DATABASE_URL: postgresql+asyncpg://sp2:sp2@postgres:5432/sp2
      CORS_ORIGINS: ${CORS_ORIGINS:-[]}
      DOCUMENT_STORAGE_DIR: ${DOCUMENT_STORAGE_DIR:-/app/storage/documents}
      DOCUMENT_MAX_UPLOAD_BYTES: ${DOCUMENT_MAX_UPLOAD_BYTES:-10485760}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    stop_grace_period: 90s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT:-${FRONTEND_PORT:-5173}}:8080"
    volumes:
      - documents_storage:${DOCUMENT_STORAGE_DIR:-/app/storage/documents}
      - easyocr_models:/root/.EasyOCR
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  documents_storage:
  easyocr_models:
